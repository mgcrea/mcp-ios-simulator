name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest node engines.node claims, plus current LTS. An untested
        # floor is a guess — every Dockerfile here is node 24.
        node: ["22", "lts/*"]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: TypeScript 🔍
        run: pnpm run typecheck
      - name: Test 🧪
        run: pnpm run test
      - name: Build 📦
        run: pnpm run build
      # Every client config in the wild spells this server `npx -y <package>`,
      # and npx picks the bin by name: it only forgives a mismatch while the
      # package ships exactly one. So the day a second bin is added, that
      # command starts failing with "could not determine executable to run" —
      # at the client, with stderr swallowed, long after CI was green. Mirrors
      # npm's own getBinFromManifest, so it fails here first instead.
      - name: npx can resolve a bin 🔒
        run: |
          node -e "
            const pkg = require('./package.json');
            const bin = pkg.bin ?? {};
            const unscoped = pkg.name.slice(pkg.name.indexOf('/') + 1);
            if (new Set(Object.values(bin)).size > 1 && !bin[unscoped]) {
              console.error('npx cannot pick a bin for ' + pkg.name + ': none of [' +
                Object.keys(bin).join(', ') + '] is named ' + unscoped + '.');
              console.error('Add a ' + unscoped + ' alias pointing at the server entry point.');
              process.exit(1);
            }
          "
      # `link:../mcp-ios-core` is how this repo is developed before a core
      # release, and it must never reach npm: it resolves to a sibling directory
      # that exists on one laptop. Install would fail here anyway, but it would
      # fail as a 404 on a package name, which reads like a registry problem
      # rather than like a dependency someone forgot to unpin.
      - name: No local dependencies 🔒
        run: |
          node -e "
            const deps = require('./package.json').dependencies ?? {};
            const local = Object.entries(deps).filter(([, v]) => /^(link|file):/.test(v));
            if (local.length) {
              console.error('local dependency specs must not ship: ' +
                local.map(([k, v]) => k + '@' + v).join(', '));
              process.exit(1);
            }
          "
      # The tool list is the server's public contract and is easy to change by
      # accident. Three phases — and the polarity is the opposite of every other
      # server in the fleet, because writes here default ON. The state worth
      # failing over is therefore a tool silently *joining* the default surface,
      # which the exact counts catch and a grep would not.
      #
      # HOME is pointed at nothing so the runner's own dotfiles can never be
      # picked up.
      - name: MCP smoke test 🧪
        run: |
          list_tools() {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | env HOME=/nonexistent IOS_SIMULATOR_CONFIG=/nonexistent.json "$@" node dist/cli.js 2>/dev/null
          }

          # 1. With nothing configured — no Xcode, no simulator on a Linux
          #    runner — the server must still speak MCP. One that exits here
          #    shows in the client as a bare "Connection closed" with stderr
          #    swallowed, so nothing ever explains what to set.
          list_tools > /tmp/default.json
          grep -q '"name":"ios_simulator_diagnostics"' /tmp/default.json \
            || { echo "diagnostics missing from an unconfigured server"; exit 1; }
          grep -q '"name":"ios_simulator_screenshot"' /tmp/default.json \
            || { echo "the observe tools must be registered without any configuration"; exit 1; }
          grep -q '"name":"ios_simulator_tap"' /tmp/default.json \
            || { echo "writes must default ON — the driving tools are missing"; exit 1; }

          # 2. Turning writes OFF must REMOVE the driving tools, not refuse
          #    them: a refusal still lets a model try, retry and reason about a
          #    way around it.
          list_tools IOS_SIMULATOR_ALLOW_WRITES=0 > /tmp/readonly.json
          ! grep -qE '"name":"ios_simulator_(tap|tap_element|swipe|type|press_button|install|launch|terminate|open_url|power|erase|set_environment|push|restart_wda)"' /tmp/readonly.json \
            || { echo "driving tools survived IOS_SIMULATOR_ALLOW_WRITES=0"; exit 1; }

          # 3. The gate must only ever REMOVE. A gate written the wrong way
          #    round would make the read tools vanish instead, which phase 2
          #    cannot see — it only looks for extras.
          grep -o '"name":"ios_simulator_[a-z_]*"' /tmp/readonly.json | sort -u > /tmp/a.txt
          grep -o '"name":"ios_simulator_[a-z_]*"' /tmp/default.json  | sort -u > /tmp/b.txt
          missing=$(comm -23 /tmp/a.txt /tmp/b.txt)
          [ -z "$missing" ] \
            || { echo "these tools disappeared when writes were enabled: $missing"; exit 1; }

          # The exact counts. On a server whose default is the *permissive*
          # state, a tool quietly joining it is the regression worth failing on,
          # and no grep above would notice.
          [ "$(wc -l < /tmp/a.txt)" -eq 5 ] \
            || { echo "expected exactly 5 read tools, got $(wc -l < /tmp/a.txt)"; exit 1; }
          [ "$(wc -l < /tmp/b.txt)" -eq 19 ] \
            || { echo "expected exactly 19 tools with writes on, got $(wc -l < /tmp/b.txt)"; exit 1; }
          echo "smoke test ok: 5 read tools, 14 added by the write gate"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # id-token: write is required for OIDC trusted publishing + provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Upgrade npm 🔧
        # OIDC trusted publishing needs a recent npm CLI
        run: npm install -g npm@latest
      # A version already on npm cannot be republished, so re-running this job
      # would fail on a duplicate. Skip instead, so pushing a tag is always safe.
      - name: Check npm for this version 🔍
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish 🚀
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Create release 🏷️
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
